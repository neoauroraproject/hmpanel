
# ─────────────────────────────────────────────────────────────────
# HMPanel Panel — Production Docker Compose
# ─────────────────────────────────────────────────────────────────

services:

  # ── Application (Backend API + Frontend) ─────────────────────────
  panel-app:
    image: ghcr.io/neoauroraproject/hmpanel:latest
    container_name: hmpanel-panel
    restart: unless-stopped
    expose:
      - "3000"  # Frontend (served via nginx)
      - "4000"  # Backend API (served via nginx)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${BACKEND_PORT:-4000}
      - APP_PORT=${APP_PORT:-3000}
      - RELEASE_MODE=${RELEASE_MODE:-COMMUNITY}
      - LICENSE_SERVER_URL=${LICENSE_SERVER_URL:-https://license.hmray.pro}
      - LICENSE_SERVER_URL_FALLBACK=${LICENSE_SERVER_URL_FALLBACK:-https://license.hmrayserver.com}
      - LICENSE_PRODUCT_ID=${LICENSE_PRODUCT_ID:-hmpanel}
      - PREMIUM_PLUGIN_PATH=${PREMIUM_PLUGIN_PATH:-/opt/hmpanel/premium/backend/index.js}
      - HMPANEL_DIST=/app/backend/dist
      - NODE_PATH=/app/backend/node_modules:/app/node_modules
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api-proxy}
      - NEXT_PUBLIC_RELEASE_MODE=${RELEASE_MODE:-COMMUNITY}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
      - logs:/app/logs
      - premium:/opt/hmpanel/premium
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx/ssl:/etc/nginx/ssl
      - ./acme.sh:/app/acme.sh
      - ./.env:/app/.env
      - ./nginx:/app/nginx_host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: hmpanel-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - APP_PORT=${APP_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - PANEL_DOMAIN=${DOMAIN:-${PANEL_DOMAIN:-localhost}}
    volumes:
      - ./nginx/nginx.conf.http.template:/etc/nginx/nginx.conf.http.template:ro
      - ./nginx/nginx.conf.ssl.template:/etc/nginx/nginx.conf.ssl.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/generate_config.sh:/etc/nginx/generate_config.sh:ro
      - ./nginx/vhost-domain.ssl.template:/etc/nginx/vhost-domain.ssl.template:ro
      - ./nginx/vhost-domain.http.template:/etc/nginx/vhost-domain.http.template:ro
    command: >
      /bin/sh -c "
      sh /etc/nginx/generate_config.sh && exec nginx -g 'daemon off;'
      "
    depends_on:
      - panel-app
    networks:
      - panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Host Agent ──────────────────────────────────────────────────
  host-agent:
    image: alpine
    container_name: hmpanel-host-agent
    privileged: true
    pid: host
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - /:/host

  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: hmpanel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-panel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-panel_pass}
      - POSTGRES_DB=${POSTGRES_DB:-panel_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panel_user} -d ${POSTGRES_DB:-panel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis Cache ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hmpanel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────
# Named Volumes — persistent across restarts
# ─────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: hmpanel_pgdata
  redisdata:
    name: hmpanel_redisdata
  uploads:
    name: hmpanel_uploads
  backups:
    name: hmpanel_backups
  logs:
    name: hmpanel_logs
  premium:
    name: hmpanel_premium

# ─────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────
networks:
  panel-network:
    name: hmpanel_network
    driver: bridge
